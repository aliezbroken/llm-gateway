# LLM Gateway nginx 站点配置
# 单实例网关：对外 /v1/*（OpenAI 兼容）与管理面 /api/* 均由 uvicorn :8000 提供；
# 根路径 / 托管前端静态产物 web/dist。
#
# 安装：复制到 /etc/nginx/conf.d/gateway.conf（或 sites-available + 软链到 sites-enabled）后
#   sudo nginx -t && sudo systemctl reload nginx
#
# 注意：本配置文件监听不包含默认 server 段的完整形式；请确认 /etc/nginx/nginx.conf
# 中已 include conf.d/*.conf，且 80 端口未被其他站点占用。

# ---- [可选] 网关挂掉时"直连 vLLM 兜底"----
# 常规情况下只有 127.0.0.1:8000 这一台网关，全部流量走它；
# 若希望网关进程挂掉后请求自动 failover 到上游 vLLM（同 UPSTREAM_URL）
# （绕过网关鉴权/计费，仅作应急），可启用下面的 upstream 并把下面
# proxy_pass http://gateway_backend; 替换为 http://llm_backend:
#
# upstream llm_backend {
#     server 127.0.0.1:8000;
#     server <UPSTREAM_URL> backup;   # backup：仅当前面不可达时启用（示例，勿写真实内网地址）
# }

server {
    listen 80;
    # listen 443 ssl;        # 如需 https，放开并配置证书
    # ssl_certificate     /etc/nginx/ssl/xxx.crt;
    # ssl_certificate_key /etc/nginx/ssl/xxx.key;
    server_name _;

    # 前端静态产物（vite build 输出，例如 /opt/llm-gateway/web/dist）
    root /opt/llm-gateway/web/dist;
    index index.html;

    # ---------- 管理面 /api/* ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering off;

        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_connect_timeout 10s;
    }

    # ---------- 对外网关面 /v1/*（OpenAI 兼容，含 SSE 流式） ----------
    location /v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        # SSE 流式需要 HTTP/1.1 + 关闭缓冲，保证分片即时透传
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_connect_timeout 10s;
    }

    # ---------- 前端 SPA 静态资源 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
